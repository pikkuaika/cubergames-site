<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUBER SNAKE 360</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 50% 35%, #162033 0%, #090d15 42%, #030406 100%);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 640px;
      min-height: 360px;
    }

    #lobby, #countdown, #game, #gameOver {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    #lobby {
      display: block;
      padding: 3.5% 5%;
    }

    .title {
      text-align: center;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 8px;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      letter-spacing: 8px;
      opacity: .55;
      margin-top: 8px;
    }

    .lobbyTable {
      display: table;
      width: 100%;
      height: calc(100% - 100px);
      table-layout: fixed;
    }

    .lobbyCol {
      display: table-cell;
      width: 50%;
      vertical-align: middle;
      padding: 24px 4%;
    }

    .joinSide {
      text-align: center;
    }

    .scanTitle {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    #qrBox {
      width: 300px;
      height: 300px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      padding: 12px;
      overflow: hidden;
    }

    #qrCanvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .roomLabel {
      margin-top: 20px;
      opacity: .5;
      letter-spacing: 4px;
      font-size: 14px;
    }

    #roomCode {
      font-size: 68px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 12px;
      margin-top: 8px;
    }

    .joinUrl {
      margin-top: 10px;
      opacity: .5;
      font-size: 16px;
    }

    .playersTitle {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 16px;
    }

    #playerCount {
      float: right;
      font-size: 18px;
      opacity: .45;
      margin-top: 12px;
    }

    #players {
      clear: both;
    }

    .playerRow, .waitingRow {
      min-height: 66px;
      margin-bottom: 10px;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.055);
      line-height: 40px;
    }

    .waitingRow {
      color: rgba(255,255,255,.3);
      border-style: dashed;
    }

    .playerDot {
      display: inline-block;
      vertical-align: middle;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.35);
      margin-right: 12px;
      background: #333;
    }

    .playerName {
      display: inline-block;
      vertical-align: middle;
      font-size: 22px;
      font-weight: 800;
    }

    .host {
      float: right;
      margin-top: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      font-size: 11px;
      font-weight: 900;
      line-height: 24px;
    }

    #modeDisplay {
      margin-top: 18px;
      opacity: .55;
      font-size: 17px;
    }

    #connectionStatus {
      position: absolute;
      right: 20px;
      bottom: 14px;
      opacity: .4;
      font-size: 13px;
    }

    #countdown {
      display: none;
      background: rgba(2,4,8,.96);
      text-align: center;
    }

    .countWrap {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      margin-top: -160px;
    }

    .countLabel {
      font-size: 26px;
      letter-spacing: 6px;
      opacity: .55;
    }

    #countdownNumber {
      font-size: 250px;
      line-height: 1;
      font-weight: 900;
      margin-top: 10px;
    }

    #game {
      display: none;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #scoreboard {
      position: absolute;
      left: 20px;
      top: 20px;
      width: 220px;
    }

    .scoreRow {
      margin-bottom: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,.42);
      font-size: 16px;
    }

    .scoreDot {
      display: inline-block;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }

    .scoreValue {
      float: right;
      font-weight: 900;
    }

    .dead {
      opacity: .3;
    }

    #gameOver {
      display: none;
      background: rgba(2,4,8,.96);
      text-align: center;
    }

    .overWrap {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      margin-top: -220px;
    }

    .overSmall {
      opacity: .5;
      letter-spacing: 7px;
      font-size: 20px;
    }

    #winnerName {
      font-size: 70px;
      font-weight: 900;
      margin-top: 12px;
    }

    #finalScores {
      max-width: 620px;
      margin: 28px auto 0;
    }

    .finalRow {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      text-align: left;
    }

    .finalPos {
      display: inline-block;
      width: 42px;
      opacity: .5;
    }

    .finalPoints {
      float: right;
      font-weight: 900;
    }

    .newInfo {
      margin-top: 25px;
      opacity: .4;
    }

    @media screen and (max-width: 1000px) {
      .title { font-size: 34px; }
      .subtitle { font-size: 14px; }
      #qrBox { width: 240px; height: 240px; }
      #roomCode { font-size: 50px; }
      .playersTitle { font-size: 27px; }
    }
  </style>
</head>

<body>

<div id="app">

  <div id="lobby">

    <div class="title">CUBER</div>
    <div class="subtitle">SNAKE 360</div>

    <div class="lobbyTable">

      <div class="lobbyCol joinSide">

        <div class="scanTitle">SCAN TO JOIN</div>

        <div id="qrBox">
          <canvas id="qrCanvas" width="300" height="300"></canvas>
        </div>

        <div class="roomLabel">ROOM CODE</div>
        <div id="roomCode">----</div>
        <div class="joinUrl">cubergames.com/join/</div>

      </div>


      <div class="lobbyCol">

        <div>
          <span class="playersTitle">PLAYERS</span>
          <span id="playerCount">0 / 4</span>
        </div>

        <div id="players"></div>

        <div id="modeDisplay">Waiting for players...</div>

      </div>

    </div>

    <div id="connectionStatus">Starting...</div>

  </div>


  <div id="countdown">
    <div class="countWrap">
      <div class="countLabel">GET READY</div>
      <div id="countdownNumber">3</div>
    </div>
  </div>


  <div id="game">
    <canvas id="gameCanvas"></canvas>
    <div id="scoreboard"></div>
  </div>


  <div id="gameOver">
    <div class="overWrap">
      <div class="overSmall">GAME OVER</div>
      <div id="winnerName">WINNER</div>
      <div id="finalScores"></div>
      <div class="newInfo">Host can start a new game from the phone</div>
    </div>
  </div>

</div>


<script>
(function () {
  "use strict";

  var API_HTTP = "https://game-api.cubergames.com";
  var API_WS = "wss://game-api.cubergames.com";
  var JOIN_URL = "https://cubergames.com/join/";
  var MAX_PLAYERS = 4;

  var COLORS = {
    red:    { body: "#ff3d3d", dark: "#b91527", light: "#ff8585" },
    blue:   { body: "#3787ff", dark: "#174da8", light: "#8bbaff" },
    green:  { body: "#36d66b", dark: "#16783a", light: "#8af0aa" },
    yellow: { body: "#ffd93d", dark: "#b58a10", light: "#fff08a" }
  };

  var roomCode = "";
  var socket = null;
  var roomState = null;
  var reconnectTimer = null;

  var gameRunning = false;
  var lastFrame = 0;
  var apple = null;
  var worms = {};
  var wormOrder = [];
  var gamePlayers = [];
  var gameLoopTimer = null;
  var lastStateBroadcast = 0;

  var lobbyEl = document.getElementById("lobby");
  var countdownEl = document.getElementById("countdown");
  var countdownNumberEl = document.getElementById("countdownNumber");
  var gameEl = document.getElementById("game");
  var gameOverEl = document.getElementById("gameOver");
  var roomCodeEl = document.getElementById("roomCode");
  var qrCanvasEl = document.getElementById("qrCanvas");
  var playersEl = document.getElementById("players");
  var playerCountEl = document.getElementById("playerCount");
  var modeDisplayEl = document.getElementById("modeDisplay");
  var connectionStatusEl = document.getElementById("connectionStatus");
  var scoreboardEl = document.getElementById("scoreboard");
  var winnerNameEl = document.getElementById("winnerName");
  var finalScoresEl = document.getElementById("finalScores");
  var canvas = document.getElementById("gameCanvas");
  var ctx = canvas.getContext ? canvas.getContext("2d") : null;

  function setStatus(text) {
    connectionStatusEl.innerHTML = text;
  }

  function xhrGet(url, onSuccess, onError) {
    var xhr;

    try {
      xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status >= 200 && xhr.status < 300) {
            onSuccess(xhr.responseText);
          } else {
            onError();
          }
        }
      };
      xhr.onerror = onError;
      xhr.send(null);
    } catch (e) {
      onError();
    }
  }

  function startTV() {
    setStatus("Creating room...");

    xhrGet(
      API_HTTP + "/create-room?ts=" + new Date().getTime(),
      function (text) {
        var data;

        try {
          data = JSON.parse(text);
        } catch (e) {
          setStatus("Room response error");
          setTimeout(startTV, 3000);
          return;
        }

        roomCode = String(data.room || "").toUpperCase();

        if (!roomCode) {
          setStatus("Room creation failed");
          setTimeout(startTV, 3000);
          return;
        }

        roomCodeEl.innerHTML = roomCode;
        updateQR();
        connectTV();
      },
      function () {
        setStatus("Server connection failed");
        setTimeout(startTV, 3000);
      }
    );
  }

  /*
    Local QR encoder.
    Fixed QR Version 3-L (29x29), byte mode.
    This fits the CUBER join URL and does not call any external QR service.
  */
  function qrMake(text) {
    var size = 29;
    var dataCodewords = 55;
    var eccCodewords = 15;
    var m = [];
    var f = [];
    var x, y, i, j;

    for (y = 0; y < size; y++) {
      m[y] = [];
      f[y] = [];
      for (x = 0; x < size; x++) {
        m[y][x] = false;
        f[y][x] = false;
      }
    }

    function setxy(px, py, value) {
      if (px >= 0 && px < size && py >= 0 && py < size) {
        m[py][px] = !!value;
        f[py][px] = true;
      }
    }

    function finder(x0, y0) {
      var dx, dy, on;
      for (dy = -1; dy <= 7; dy++) {
        for (dx = -1; dx <= 7; dx++) {
          x = x0 + dx;
          y = y0 + dy;

          if (x < 0 || x >= size || y < 0 || y >= size) {
            continue;
          }

          on =
            dx >= 0 && dx <= 6 &&
            dy >= 0 && dy <= 6 &&
            (
              dx === 0 || dx === 6 ||
              dy === 0 || dy === 6 ||
              (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4)
            );

          setxy(x, y, on);
        }
      }
    }

    function alignment(cx, cy) {
      var ax, ay, d;
      for (ay = -2; ay <= 2; ay++) {
        for (ax = -2; ax <= 2; ax++) {
          d = Math.max(Math.abs(ax), Math.abs(ay));
          setxy(cx + ax, cy + ay, d !== 1);
        }
      }
    }

    finder(0, 0);
    finder(size - 7, 0);
    finder(0, size - 7);

    /* Timing patterns. */
    for (i = 8; i < size - 8; i++) {
      if (!f[6][i]) {
        setxy(i, 6, (i % 2) === 0);
      }
      if (!f[i][6]) {
        setxy(6, i, (i % 2) === 0);
      }
    }

    /* Version 3 alignment center is 22,22. */
    alignment(22, 22);

    /* Reserve format areas. */
    for (i = 0; i < 6; i++) setxy(8, i, false);
    setxy(8, 7, false);
    setxy(8, 8, false);
    setxy(7, 8, false);

    for (i = 9; i < 15; i++) setxy(14 - i, 8, false);
    for (i = 0; i < 8; i++) setxy(size - 1 - i, 8, false);
    for (i = 8; i < 15; i++) setxy(8, size - 15 + i, false);

    /* Dark module. */
    setxy(8, size - 8, true);

    var bits = [];

    function append(value, count) {
      var k;
      for (k = count - 1; k >= 0; k--) {
        bits.push((value >>> k) & 1);
      }
    }

    /* Byte mode. */
    append(4, 4);
    append(text.length, 8);

    for (i = 0; i < text.length; i++) {
      append(text.charCodeAt(i) & 255, 8);
    }

    var capacity = dataCodewords * 8;

    for (i = 0; i < 4 && bits.length < capacity; i++) {
      bits.push(0);
    }

    while (bits.length % 8) {
      bits.push(0);
    }

    var data = [];
    var value;
    var k;

    for (i = 0; i < bits.length; i += 8) {
      value = 0;
      for (k = 0; k < 8; k++) {
        value = (value << 1) | bits[i + k];
      }
      data.push(value);
    }

    var pads = [236, 17];
    var padIndex = 0;

    while (data.length < dataCodewords) {
      data.push(pads[padIndex & 1]);
      padIndex++;
    }

    function gfMul(a, b) {
      var z = 0;
      while (b) {
        if (b & 1) z ^= a;
        b >>>= 1;
        a <<= 1;
        if (a & 256) a ^= 285;
      }
      return z;
    }

    /* Build Reed-Solomon generator polynomial. */
    var generator = [1];
    var root = 1;
    var g, next;

    for (i = 0; i < eccCodewords; i++) {
      next = [];
      for (j = 0; j < generator.length + 1; j++) {
        next[j] = 0;
      }

      for (j = 0; j < generator.length; j++) {
        next[j] ^= generator[j];
        next[j + 1] ^= gfMul(generator[j], root);
      }

      generator = next;
      root = gfMul(root, 2);
    }

    var rem = [];
    for (i = 0; i < eccCodewords; i++) rem[i] = 0;

    for (i = 0; i < data.length; i++) {
      var factor = data[i] ^ rem[0];

      for (j = 0; j < eccCodewords - 1; j++) {
        rem[j] = rem[j + 1];
      }
      rem[eccCodewords - 1] = 0;

      for (j = 0; j < eccCodewords; j++) {
        rem[j] ^= gfMul(generator[j + 1], factor);
      }
    }

    var code = data.concat(rem);
    var dataBits = [];

    for (i = 0; i < code.length; i++) {
      for (k = 7; k >= 0; k--) {
        dataBits.push((code[i] >>> k) & 1);
      }
    }

    /* Place data, mask pattern 0. */
    var idx = 0;
    var right = size - 1;
    var vert;
    var up;
    var bit;

    while (right >= 1) {
      if (right === 6) right--;

      for (vert = 0; vert < size; vert++) {
        up = (((right + 1) & 2) === 0);
        y = up ? size - 1 - vert : vert;

        for (j = 0; j < 2; j++) {
          x = right - j;

          if (!f[y][x]) {
            bit = idx < dataBits.length ? !!dataBits[idx] : false;
            idx++;

            if (((x + y) % 2) === 0) {
              bit = !bit;
            }

            m[y][x] = bit;
          }
        }
      }

      right -= 2;
    }

    /* Format information: error correction L, mask 0. */
    var formatData = (1 << 3);
    var formatRemainder = formatData;

    for (i = 0; i < 10; i++) {
      formatRemainder =
        (formatRemainder << 1) ^
        ((formatRemainder >>> 9) * 1335);
    }

    var formatBits =
      ((formatData << 10) | formatRemainder) ^ 21522;

    function formatBit(n) {
      return ((formatBits >>> n) & 1) !== 0;
    }

    for (i = 0; i < 6; i++) setxy(8, i, formatBit(i));
    setxy(8, 7, formatBit(6));
    setxy(8, 8, formatBit(7));
    setxy(7, 8, formatBit(8));

    for (i = 9; i < 15; i++) setxy(14 - i, 8, formatBit(i));
    for (i = 0; i < 8; i++) setxy(size - 1 - i, 8, formatBit(i));
    for (i = 8; i < 15; i++) setxy(8, size - 15 + i, formatBit(i));

    setxy(8, size - 8, true);

    return m;
  }

  function drawQR(text) {
    var matrix = qrMake(text);
    var canvas = qrCanvasEl;
    var q = canvas.getContext("2d");
    var count = matrix.length;
    var border = 4;
    var scale = Math.floor(canvas.width / (count + border * 2));
    var used = (count + border * 2) * scale;
    var offsetX = Math.floor((canvas.width - used) / 2);
    var offsetY = Math.floor((canvas.height - used) / 2);
    var x, y;

    q.fillStyle = "#ffffff";
    q.fillRect(0, 0, canvas.width, canvas.height);

    q.fillStyle = "#000000";

    for (y = 0; y < count; y++) {
      for (x = 0; x < count; x++) {
        if (matrix[y][x]) {
          q.fillRect(
            offsetX + (x + border) * scale,
            offsetY + (y + border) * scale,
            scale,
            scale
          );
        }
      }
    }
  }

  function updateQR() {
    var join = JOIN_URL + "?room=" + encodeURIComponent(roomCode);
    drawQR(join);
  }

  function connectTV() {
    var wsUrl;

    if (!roomCode) {
      return;
    }

    if (!window.WebSocket) {
      setStatus("This TV browser does not support WebSocket");
      return;
    }

    if (socket) {
      try { socket.close(); } catch (e) {}
    }

    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
    }

    setStatus("Connecting...");

    wsUrl =
      API_WS +
      "/room/" +
      encodeURIComponent(roomCode) +
      "?role=tv";

    try {
      socket = new WebSocket(wsUrl);
    } catch (e2) {
      setStatus("WebSocket failed");
      reconnectTimer = setTimeout(connectTV, 2500);
      return;
    }

    socket.onopen = function () {
      setStatus("ONLINE");
    };

    socket.onmessage = function (event) {
      handleServerMessage(event.data);
    };

    socket.onclose = function () {
      setStatus("Reconnecting...");
      reconnectTimer = setTimeout(connectTV, 1800);
    };

    socket.onerror = function () {
      setStatus("Connection error");
    };
  }

  function handleServerMessage(raw) {
    var msg;

    try {
      msg = JSON.parse(raw);
    } catch (e) {
      return;
    }

    if (msg.type === "room_state") {
      roomState = msg;
      renderLobby();

      if (msg.status === "lobby" && !gameRunning) {
        showLobby();
      }
      return;
    }

    if (msg.type === "countdown_start") {
      beginCountdown(msg);
      return;
    }

    if (msg.type === "steer") {
      handleSteer(msg);
      return;
    }

    if (msg.type === "return_to_lobby") {
      resetGame();
      showLobby();
      return;
    }
  }

  function renderLobby() {
    var players;
    var i;
    var p;
    var row;
    var dot;
    var name;
    var host;
    var waiting;
    var color;

    if (!roomState) {
      return;
    }

    players = roomState.players || [];

    playerCountEl.innerHTML = players.length + " / " + MAX_PLAYERS;
    playersEl.innerHTML = "";

    for (i = 0; i < players.length; i++) {
      p = players[i];

      row = document.createElement("div");
      row.className = "playerRow";

      dot = document.createElement("span");
      dot.className = "playerDot";

      color = p.color && COLORS[p.color] ? COLORS[p.color].body : "#333";
      dot.style.backgroundColor = color;

      name = document.createElement("span");
      name.className = "playerName";
      name.innerHTML = escapeHtml(p.name || "PLAYER");

      row.appendChild(dot);
      row.appendChild(name);

      if (p.isHost) {
        host = document.createElement("span");
        host.className = "host";
        host.innerHTML = "HOST";
        row.appendChild(host);
      }

      playersEl.appendChild(row);
    }

    for (i = players.length; i < MAX_PLAYERS; i++) {
      waiting = document.createElement("div");
      waiting.className = "waitingRow";
      waiting.innerHTML = "Waiting for player...";
      playersEl.appendChild(waiting);
    }

    if (roomState.mode === "SOLO") {
      modeDisplayEl.innerHTML = "MODE: SOLO";
    } else if (roomState.mode === "MULTI") {
      modeDisplayEl.innerHTML = "MODE: MULTIPLAYER";
    } else if (players.length) {
      modeDisplayEl.innerHTML = "Host chooses game mode";
    } else {
      modeDisplayEl.innerHTML = "Scan QR code to join";
    }
  }

  function beginCountdown(msg) {
    var sourcePlayers;
    var i;
    var duration;
    var started;

    if (gameRunning) {
      return;
    }

    sourcePlayers =
      msg.players ||
      (roomState && roomState.players ? roomState.players : []);

    gamePlayers = [];

    for (i = 0; i < sourcePlayers.length; i++) {
      gamePlayers.push({
        id: Number(sourcePlayers[i].id),
        name: sourcePlayers[i].name || "PLAYER",
        color: sourcePlayers[i].color || "green"
      });
    }

    lobbyEl.style.display = "none";
    gameEl.style.display = "none";
    gameOverEl.style.display = "none";
    countdownEl.style.display = "block";

    duration = Number(msg.duration) || 2400;
    started = new Date().getTime();

    function tick() {
      var elapsed = new Date().getTime() - started;
      var remaining = duration - elapsed;
      var ratio;

      if (remaining <= 0) {
        countdownNumberEl.innerHTML = "GO!";
        setTimeout(function () {
          countdownEl.style.display = "none";
          startGame();
        }, 250);
        return;
      }

      ratio = remaining / duration;

      if (ratio > .66) {
        countdownNumberEl.innerHTML = "3";
      } else if (ratio > .33) {
        countdownNumberEl.innerHTML = "2";
      } else {
        countdownNumberEl.innerHTML = "1";
      }

      setTimeout(tick, 60);
    }

    tick();
  }

  function startGame() {
    var i;
    var spawn;
    var angle;
    var worm;

    if (!ctx) {
      setStatus("Canvas not supported");
      return;
    }

    resizeCanvas();

    worms = {};
    wormOrder = [];

    for (i = 0; i < gamePlayers.length; i++) {
      spawn = getSpawnPosition(i, gamePlayers.length);

      angle = Math.atan2(
        getGameHeight() / 2 - spawn.y,
        getGameWidth() / 2 - spawn.x
      );

      worm = createWorm(
        gamePlayers[i],
        spawn.x,
        spawn.y,
        angle
      );

      worms[String(gamePlayers[i].id)] = worm;
      wormOrder.push(String(gamePlayers[i].id));
    }

    spawnApple();

    gameRunning = true;
    gameEl.style.display = "block";
    lobbyEl.style.display = "none";
    countdownEl.style.display = "none";
    gameOverEl.style.display = "none";

    renderScoreboard();
    sendSocket({ type: "game_running" });

    lastFrame = new Date().getTime();

    if (gameLoopTimer) {
      clearTimeout(gameLoopTimer);
    }

    gameLoop();
  }

  function createWorm(player, x, y, angle) {
    var body = [];
    var i;
    var startLength = 16;

    for (i = 0; i < startLength; i++) {
      body.push({
        x: x - Math.cos(angle) * i * 7,
        y: y - Math.sin(angle) * i * 7
      });
    }

    return {
      id: Number(player.id),
      name: player.name,
      color: player.color,
      alive: true,
      score: 0,
      x: x,
      y: y,
      angle: angle,
      inputX: Math.cos(angle),
      inputY: Math.sin(angle),
      speed: 185,
      body: body,
      targetLength: startLength,
      mouthUntil: 0
    };
  }

  function getSpawnPosition(index, count) {
    var w = getGameWidth();
    var h = getGameHeight();
    var cx = w / 2;
    var cy = h / 2;
    var radius = Math.min(w, h) * .27;
    var angle = (Math.PI * 2 * index / Math.max(count, 1)) - Math.PI / 2;

    return {
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius
    };
  }

  function handleSteer(msg) {
    var worm;
    var x;
    var y;
    var mag;

    if (!gameRunning) {
      return;
    }

    worm = worms[String(Number(msg.playerId))];

    if (!worm || !worm.alive) {
      return;
    }

    x = Number(msg.x);
    y = Number(msg.y);

    if (!isFinite(x) || !isFinite(y)) {
      return;
    }

    mag = Math.sqrt(x * x + y * y);

    if (mag < .08) {
      return;
    }

    worm.inputX = x / mag;
    worm.inputY = y / mag;
  }

  function gameLoop() {
    var now;
    var dt;

    if (!gameRunning) {
      return;
    }

    now = new Date().getTime();
    dt = Math.min((now - lastFrame) / 1000, .04);
    lastFrame = now;

    updateGame(dt, now);
    drawGame(now);

    if (now - lastStateBroadcast > 220) {
      lastStateBroadcast = now;
      broadcastTVState();
    }

    gameLoopTimer = setTimeout(gameLoop, 16);
  }

  function updateGame(dt, now) {
    var i;
    var worm;
    var targetAngle;
    var diff;
    var maxTurn;
    var oldX;
    var oldY;
    var appleDistance;
    var aliveCount = 0;
    var w = getGameWidth();
    var h = getGameHeight();
    var margin = 16;

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];

      if (!worm || !worm.alive) {
        continue;
      }

      targetAngle = Math.atan2(worm.inputY, worm.inputX);
      diff = normalizeAngle(targetAngle - worm.angle);
      maxTurn = 5.5 * dt;
      diff = clamp(diff, -maxTurn, maxTurn);
      worm.angle += diff;

      oldX = worm.x;
      oldY = worm.y;

      worm.x += Math.cos(worm.angle) * worm.speed * dt;
      worm.y += Math.sin(worm.angle) * worm.speed * dt;

      if (
        worm.x < margin ||
        worm.x > w - margin ||
        worm.y < margin ||
        worm.y > h - margin
      ) {
        killWorm(worm);
        continue;
      }

      worm.body.unshift({ x: worm.x, y: worm.y });

      while (worm.body.length > worm.targetLength) {
        worm.body.pop();
      }

      if (apple) {
        appleDistance = distance(worm.x, worm.y, apple.x, apple.y);

        if (appleDistance < 29) {
          worm.score += 1;
          worm.targetLength += 5;
          worm.mouthUntil = now + 320;
          spawnApple();
          renderScoreboard();
        }
      }
    }

    checkWormCollisions();

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];
      if (worm && worm.alive) {
        aliveCount++;
      }
    }

    if (aliveCount === 0) {
      finishGame();
    }
  }

  function checkWormCollisions() {
    var a;
    var b;
    var i;
    var j;
    var worm;
    var other;
    var start;
    var point;

    for (a = 0; a < wormOrder.length; a++) {
      worm = worms[wormOrder[a]];

      if (!worm || !worm.alive) {
        continue;
      }

      for (b = 0; b < wormOrder.length; b++) {
        other = worms[wormOrder[b]];

        if (!other || !other.alive) {
          continue;
        }

        start = worm.id === other.id ? 14 : 3;

        for (i = start; i < other.body.length; i += 2) {
          point = other.body[i];

          if (distance(worm.x, worm.y, point.x, point.y) < 13) {
            killWorm(worm);
            break;
          }
        }

        if (!worm.alive) {
          break;
        }
      }
    }
  }

  function killWorm(worm) {
    if (!worm.alive) {
      return;
    }

    worm.alive = false;
    worm.body = [];
    renderScoreboard();
  }

  function spawnApple() {
    var padding = 80;
    var w = getGameWidth();
    var h = getGameHeight();

    apple = {
      x: randomBetween(padding, Math.max(padding + 1, w - padding)),
      y: randomBetween(padding, Math.max(padding + 1, h - padding))
    };
  }

  function drawGame(now) {
    var i;
    var worm;
    var w = getGameWidth();
    var h = getGameHeight();

    ctx.clearRect(0, 0, w, h);
    drawBackground(w, h);

    if (apple) {
      drawApple(apple.x, apple.y);
    }

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];
      if (worm && worm.alive) {
        drawWorm(worm, now);
      }
    }
  }

  function drawBackground(w, h) {
    var grad;
    var x;
    var y;
    var grid = 50;

    grad = ctx.createRadialGradient(
      w / 2, h / 2, 0,
      w / 2, h / 2, Math.max(w, h)
    );

    grad.addColorStop(0, "#101827");
    grad.addColorStop(1, "#030507");

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = "rgba(255,255,255,.035)";
    ctx.lineWidth = 1;

    for (x = 0; x < w; x += grid) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }

    for (y = 0; y < h; y += grid) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
  }

  function drawApple(x, y) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = "#ff354f";
    ctx.beginPath();
    ctx.arc(-7, 2, 14, 0, Math.PI * 2, false);
    ctx.arc(7, 2, 14, 0, Math.PI * 2, false);
    ctx.fill();

    ctx.strokeStyle = "#6b451e";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(3, -24);
    ctx.stroke();

    ctx.fillStyle = "#43d66f";
    ctx.beginPath();
    ctx.arc(10, -19, 6, 0, Math.PI * 2, false);
    ctx.fill();

    ctx.restore();
  }

  function drawWorm(worm, now) {
    var palette = COLORS[worm.color] || COLORS.green;
    var body = worm.body;
    var i;

    if (!body || body.length < 2) {
      return;
    }

    ctx.save();

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = palette.body;
    ctx.lineWidth = 24;

    ctx.beginPath();
    ctx.moveTo(body[0].x, body[0].y);

    for (i = 1; i < body.length; i++) {
      ctx.lineTo(body[i].x, body[i].y);
    }

    ctx.stroke();

    ctx.translate(worm.x, worm.y);
    ctx.rotate(worm.angle);

    ctx.fillStyle = palette.body;
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2, false);
    ctx.fill();

    drawEye(7, -8);
    drawEye(7, 8);

    if (now < worm.mouthUntil) {
      ctx.fillStyle = "#25040a";
      ctx.beginPath();
      ctx.arc(15, 0, 7, 0, Math.PI * 2, false);
      ctx.fill();
    } else {
      ctx.strokeStyle = "#4a1018";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(11, 0, 7, -.7, .7, false);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawEye(x, y) {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2, false);
    ctx.fill();

    ctx.fillStyle = "#080b10";
    ctx.beginPath();
    ctx.arc(x + 2, y, 2.4, 0, Math.PI * 2, false);
    ctx.fill();
  }

  function renderScoreboard() {
    var list = [];
    var i;
    var worm;
    var row;
    var dot;
    var value;

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];
      if (worm) {
        list.push(worm);
      }
    }

    list.sort(function (a, b) {
      return b.score - a.score;
    });

    scoreboardEl.innerHTML = "";

    for (i = 0; i < list.length; i++) {
      worm = list[i];

      row = document.createElement("div");
      row.className = "scoreRow" + (worm.alive ? "" : " dead");

      dot = document.createElement("span");
      dot.className = "scoreDot";
      dot.style.backgroundColor =
        COLORS[worm.color] ? COLORS[worm.color].body : "#fff";

      value = document.createElement("span");
      value.className = "scoreValue";
      value.innerHTML = String(worm.score);

      row.appendChild(dot);
      row.appendChild(document.createTextNode(worm.name));
      row.appendChild(value);

      scoreboardEl.appendChild(row);
    }
  }

  function broadcastTVState() {
    var list = [];
    var i;
    var worm;

    if (!gameRunning) {
      return;
    }

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];
      if (worm) {
        list.push({
          id: worm.id,
          score: worm.score,
          alive: worm.alive
        });
      }
    }

    sendSocket({
      type: "tv_state",
      state: { players: list }
    });
  }

  function finishGame() {
    var results = [];
    var i;
    var worm;
    var winner;

    if (!gameRunning) {
      return;
    }

    gameRunning = false;

    if (gameLoopTimer) {
      clearTimeout(gameLoopTimer);
      gameLoopTimer = null;
    }

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];

      if (worm) {
        results.push({
          id: worm.id,
          name: worm.name,
          color: worm.color,
          score: worm.score
        });
      }
    }

    results.sort(function (a, b) {
      return b.score - a.score;
    });

    winner = results.length ? results[0] : null;

    sendSocket({
      type: "game_over",
      results: results,
      winner: winner
    });

    showGameOver(results, winner);
  }

  function showGameOver(results, winner) {
    var i;
    var row;

    gameEl.style.display = "none";
    countdownEl.style.display = "none";
    lobbyEl.style.display = "none";
    gameOverEl.style.display = "block";

    winnerNameEl.innerHTML = winner ? escapeHtml(winner.name) : "NO WINNER";

    if (winner && COLORS[winner.color]) {
      winnerNameEl.style.color = COLORS[winner.color].body;
    } else {
      winnerNameEl.style.color = "#fff";
    }

    finalScoresEl.innerHTML = "";

    for (i = 0; i < results.length; i++) {
      row = document.createElement("div");
      row.className = "finalRow";

      row.innerHTML =
        '<span class="finalPos">#' + (i + 1) + '</span>' +
        escapeHtml(results[i].name) +
        '<span class="finalPoints">' +
        results[i].score +
        (results[i].score === 1 ? " POINT" : " POINTS") +
        "</span>";

      finalScoresEl.appendChild(row);
    }
  }

  function resetGame() {
    gameRunning = false;

    if (gameLoopTimer) {
      clearTimeout(gameLoopTimer);
      gameLoopTimer = null;
    }

    worms = {};
    wormOrder = [];
    gamePlayers = [];
    apple = null;
    scoreboardEl.innerHTML = "";
    finalScoresEl.innerHTML = "";
  }

  function showLobby() {
    lobbyEl.style.display = "block";
    countdownEl.style.display = "none";
    gameEl.style.display = "none";
    gameOverEl.style.display = "none";
    renderLobby();
  }

  function sendSocket(msg) {
    try {
      if (socket && socket.readyState === 1) {
        socket.send(JSON.stringify(msg));
      }
    } catch (e) {}
  }

  function resizeCanvas() {
    canvas.width = getGameWidth();
    canvas.height = getGameHeight();
  }

  function getGameWidth() {
    return window.innerWidth || document.documentElement.clientWidth || 1280;
  }

  function getGameHeight() {
    return window.innerHeight || document.documentElement.clientHeight || 720;
  }

  function normalizeAngle(a) {
    while (a > Math.PI) {
      a -= Math.PI * 2;
    }
    while (a < -Math.PI) {
      a += Math.PI * 2;
    }
    return a;
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function randomBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function distance(x1, y1, x2, y2) {
    var dx = x1 - x2;
    var dy = y1 - y2;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  if (window.attachEvent) {
    window.attachEvent("onresize", function () {
      if (gameRunning) {
        resizeCanvas();
      }
    });
  } else if (window.addEventListener) {
    window.addEventListener("resize", function () {
      if (gameRunning) {
        resizeCanvas();
      }
    }, false);
  }

  startTV();

})();
</script>
