
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUBER SNAKE 360</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 50% 35%, #162033 0%, #090d15 42%, #030406 100%);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 640px;
      min-height: 360px;
    }

    #lobby, #countdown, #game, #gameOver {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    #lobby {
      display: block;
      padding: 3.5% 5%;
    }

    .title {
      text-align: center;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 8px;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      letter-spacing: 8px;
      opacity: .55;
      margin-top: 8px;
    }

    .lobbyTable {
      display: table;
      width: 100%;
      height: calc(100% - 100px);
      table-layout: fixed;
    }

    .lobbyCol {
      display: table-cell;
      width: 50%;
      vertical-align: middle;
      padding: 24px 4%;
    }

    .joinSide {
      text-align: center;
    }

    .scanTitle {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    #qrBox {
      width: 300px;
      height: 300px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      padding: 12px;
      overflow: hidden;
    }

    #qrImage {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      object-fit: contain;
    }

    .roomLabel {
      margin-top: 20px;
      opacity: .5;
      letter-spacing: 4px;
      font-size: 14px;
    }

    #roomCode {
      font-size: 68px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 12px;
      margin-top: 8px;
    }

    .joinUrl {
      margin-top: 10px;
      opacity: .5;
      font-size: 16px;
    }

    .playersTitle {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 16px;
    }

    #playerCount {
      float: right;
      font-size: 18px;
      opacity: .45;
      margin-top: 12px;
    }

    #players {
      clear: both;
    }

    .playerRow, .waitingRow {
      min-height: 66px;
      margin-bottom: 10px;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.055);
      line-height: 40px;
    }

    .waitingRow {
      color: rgba(255,255,255,.3);
      border-style: dashed;
    }

    .playerDot {
      display: inline-block;
      vertical-align: middle;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.35);
      margin-right: 12px;
      background: #333;
    }

    .playerName {
      display: inline-block;
      vertical-align: middle;
      font-size: 22px;
      font-weight: 800;
    }

    .host {
      float: right;
      margin-top: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      font-size: 11px;
      font-weight: 900;
      line-height: 24px;
    }

    #modeDisplay {
      margin-top: 18px;
      opacity: .55;
      font-size: 17px;
    }

    #connectionStatus {
      position: absolute;
      right: 20px;
      bottom: 14px;
      opacity: .4;
      font-size: 13px;
    }

    #countdown {
      display: none;
      background: rgba(2,4,8,.96);
      text-align: center;
    }

    .countWrap {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      margin-top: -160px;
    }

    .countLabel {
      font-size: 26px;
      letter-spacing: 6px;
      opacity: .55;
    }

    #countdownNumber {
      font-size: 250px;
      line-height: 1;
      font-weight: 900;
      margin-top: 10px;
    }

    #game {
      display: none;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #scoreboard {
      position: absolute;
      left: 20px;
      top: 20px;
      width: 220px;
    }

    .scoreRow {
      margin-bottom: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,.42);
      font-size: 16px;
    }

    .scoreDot {
      display: inline-block;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }

    .scoreValue {
      float: right;
      font-weight: 900;
    }

    .dead {
      opacity: .3;
    }

    #gameOver {
      display: none;
      background: rgba(2,4,8,.96);
      text-align: center;
    }

    .overWrap {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      margin-top: -220px;
    }

    .overSmall {
      opacity: .5;
      letter-spacing: 7px;
      font-size: 20px;
    }

    #winnerName {
      font-size: 70px;
      font-weight: 900;
      margin-top: 12px;
    }

    #finalScores {
      max-width: 620px;
      margin: 28px auto 0;
    }

    .finalRow {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      text-align: left;
    }

    .finalPos {
      display: inline-block;
      width: 42px;
      opacity: .5;
    }

    .finalPoints {
      float: right;
      font-weight: 900;
    }

    .newInfo {
      margin-top: 25px;
      opacity: .4;
    }

    @media screen and (max-width: 1000px) {
      .title { font-size: 34px; }
      .subtitle { font-size: 14px; }
      #qrBox { width: 240px; height: 240px; }
      #roomCode { font-size: 50px; }
      .playersTitle { font-size: 27px; }
    }
  </style>
</head>

<body>

<div id="app">

  <div id="lobby">

    <div class="title">CUBER</div>
    <div class="subtitle">SNAKE 360</div>

    <div class="lobbyTable">

      <div class="lobbyCol joinSide">

        <div class="scanTitle">SCAN TO JOIN</div>

        <div id="qrBox">
          <img id="qrImage" src="" alt="Scan to join">
        </div>

        <div class="roomLabel">ROOM CODE</div>
        <div id="roomCode">----</div>
        <div class="joinUrl">cubergames.com/join/</div>

      </div>


      <div class="lobbyCol">

        <div>
          <span class="playersTitle">PLAYERS</span>
          <span id="playerCount">0 / 4</span>
        </div>

        <div id="players"></div>

        <div id="modeDisplay">Waiting for players...</div>

      </div>

    </div>

    <div id="connectionStatus">Starting...</div>

  </div>


  <div id="countdown">
    <div class="countWrap">
      <div class="countLabel">GET READY</div>
      <div id="countdownNumber">3</div>
    </div>
  </div>


  <div id="game">
    <canvas id="gameCanvas"></canvas>
    <div id="scoreboard"></div>
  </div>


  <div id="gameOver">
    <div class="overWrap">
      <div class="overSmall">GAME OVER</div>
      <div id="winnerName">WINNER</div>
      <div id="finalScores"></div>
      <div class="newInfo">Host can start a new game from the phone</div>
    </div>
  </div>

</div>


<script>
(function () {
  "use strict";

  var API_HTTP = "https://game-api.cubergames.com";
  var API_WS = "wss://game-api.cubergames.com";
  var JOIN_URL = "https://cubergames.com/join/";
  var MAX_PLAYERS = 4;

  var COLORS = {
    red:    { body: "#ff3d3d", dark: "#b91527", light: "#ff8585" },
    blue:   { body: "#3787ff", dark: "#174da8", light: "#8bbaff" },
    green:  { body: "#36d66b", dark: "#16783a", light: "#8af0aa" },
    yellow: { body: "#ffd93d", dark: "#b58a10", light: "#fff08a" }
  };

  var roomCode = "";
  var socket = null;
  var roomState = null;
  var reconnectTimer = null;

  var gameRunning = false;
  var lastFrame = 0;
  var apples = [];
  var worms = {};
  var wormOrder = [];
  var gamePlayers = [];
  var gameLoopTimer = null;
  var lastStateBroadcast = 0;

  /* Power-ups */
  var powerUp = null;
  var nextPowerUpAt = 0;
  var wallsVisibleUntil = 0;
  var WALL_REVEAL_MS = 6500;
  var GIANT_MS = 6000;
  var SPEED_MS = 5500;
  var KNIFE_MS = 15000;

  var lobbyEl = document.getElementById("lobby");
  var countdownEl = document.getElementById("countdown");
  var countdownNumberEl = document.getElementById("countdownNumber");
  var gameEl = document.getElementById("game");
  var gameOverEl = document.getElementById("gameOver");
  var roomCodeEl = document.getElementById("roomCode");
  var qrImageEl = document.getElementById("qrImage");
  var playersEl = document.getElementById("players");
  var playerCountEl = document.getElementById("playerCount");
  var modeDisplayEl = document.getElementById("modeDisplay");
  var connectionStatusEl = document.getElementById("connectionStatus");
  var scoreboardEl = document.getElementById("scoreboard");
  var winnerNameEl = document.getElementById("winnerName");
  var finalScoresEl = document.getElementById("finalScores");
  var canvas = document.getElementById("gameCanvas");
  var ctx = canvas.getContext ? canvas.getContext("2d") : null;

  function setStatus(text) {
    connectionStatusEl.innerHTML = text;
  }

  function xhrGet(url, onSuccess, onError) {
    var xhr;

    try {
      xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status >= 200 && xhr.status < 300) {
            onSuccess(xhr.responseText);
          } else {
            onError();
          }
        }
      };
      xhr.onerror = onError;
      xhr.send(null);
    } catch (e) {
      onError();
    }
  }

  function startTV() {
    setStatus("Creating room...");

    xhrGet(
      API_HTTP + "/create-room?ts=" + new Date().getTime(),
      function (text) {
        var data;

        try {
          data = JSON.parse(text);
        } catch (e) {
          setStatus("Room response error");
          setTimeout(startTV, 3000);
          return;
        }

        roomCode = String(data.room || "").toUpperCase();

        if (!roomCode) {
          setStatus("Room creation failed");
          setTimeout(startTV, 3000);
          return;
        }

        roomCodeEl.innerHTML = roomCode;
        updateQR();
        connectTV();
      },
      function () {
        setStatus("Server connection failed");
        setTimeout(startTV, 3000);
      }
    );
  }

  function updateQR() {
    qrImageEl.src =
      API_HTTP +
      "/qr?room=" +
      encodeURIComponent(roomCode) +
      "&ts=" +
      new Date().getTime();
  }

  function connectTV() {
    var wsUrl;

    if (!roomCode) {
      return;
    }

    if (!window.WebSocket) {
      setStatus("This TV browser does not support WebSocket");
      return;
    }

    if (socket) {
      try { socket.close(); } catch (e) {}
    }

    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
    }

    setStatus("Connecting...");

    wsUrl =
      API_WS +
      "/room/" +
      encodeURIComponent(roomCode) +
      "?role=tv";

    try {
      socket = new WebSocket(wsUrl);
    } catch (e2) {
      setStatus("WebSocket failed");
      reconnectTimer = setTimeout(connectTV, 2500);
      return;
    }

    socket.onopen = function () {
      setStatus("ONLINE");
    };

    socket.onmessage = function (event) {
      handleServerMessage(event.data);
    };

    socket.onclose = function () {
      setStatus("Reconnecting...");
      reconnectTimer = setTimeout(connectTV, 1800);
    };

    socket.onerror = function () {
      setStatus("Connection error");
    };
  }

  function handleServerMessage(raw) {
    var msg;

    try {
      msg = JSON.parse(raw);
    } catch (e) {
      return;
    }

    if (msg.type === "room_state") {
      roomState = msg;
      renderLobby();

      if (msg.status === "lobby" && !gameRunning) {
        showLobby();
      }
      return;
    }

    if (msg.type === "countdown_start") {
      beginCountdown(msg);
      return;
    }

    if (msg.type === "steer") {
      handleSteer(msg);
      return;
    }

    if (msg.type === "knife_use") {
      activateKnife(msg);
      return;
    }

    if (msg.type === "return_to_lobby") {
      resetGame();
      showLobby();
      return;
    }
  }

  function renderLobby() {
    var players;
    var i;
    var p;
    var row;
    var dot;
    var name;
    var host;
    var waiting;
    var color;

    if (!roomState) {
      return;
    }

    players = roomState.players || [];

    playerCountEl.innerHTML = players.length + " / " + MAX_PLAYERS;
    playersEl.innerHTML = "";

    for (i = 0; i < players.length; i++) {
      p = players[i];

      row = document.createElement("div");
      row.className = "playerRow";

      dot = document.createElement("span");
      dot.className = "playerDot";

      color = p.color && COLORS[p.color] ? COLORS[p.color].body : "#333";
      dot.style.backgroundColor = color;

      name = document.createElement("span");
      name.className = "playerName";
      name.innerHTML = escapeHtml(p.name || "PLAYER");

      row.appendChild(dot);
      row.appendChild(name);

      if (p.isHost) {
        host = document.createElement("span");
        host.className = "host";
        host.innerHTML = "HOST";
        row.appendChild(host);
      }

      playersEl.appendChild(row);
    }

    for (i = players.length; i < MAX_PLAYERS; i++) {
      waiting = document.createElement("div");
      waiting.className = "waitingRow";
      waiting.innerHTML = "Waiting for player...";
      playersEl.appendChild(waiting);
    }

    if (roomState.mode === "SOLO") {
      modeDisplayEl.innerHTML = "MODE: SOLO";
    } else if (roomState.mode === "MULTI") {
      modeDisplayEl.innerHTML = "MODE: MULTIPLAYER";
    } else if (players.length) {
      modeDisplayEl.innerHTML = "Host chooses game mode";
    } else {
      modeDisplayEl.innerHTML = "Scan QR code to join";
    }
  }

  function beginCountdown(msg) {
    var sourcePlayers;
    var i;
    var duration;
    var started;

    if (gameRunning) {
      return;
    }

    sourcePlayers =
      msg.players ||
      (roomState && roomState.players ? roomState.players : []);

    gamePlayers = [];

    for (i = 0; i < sourcePlayers.length; i++) {
      gamePlayers.push({
        id: Number(sourcePlayers[i].id),
        name: sourcePlayers[i].name || "PLAYER",
        color: sourcePlayers[i].color || "green"
      });
    }

    lobbyEl.style.display = "none";
    gameEl.style.display = "none";
    gameOverEl.style.display = "none";
    countdownEl.style.display = "block";

    duration = Number(msg.duration) || 2400;
    started = new Date().getTime();

    function tick() {
      var elapsed = new Date().getTime() - started;
      var remaining = duration - elapsed;
      var ratio;

      if (remaining <= 0) {
        countdownNumberEl.innerHTML = "GO!";
        setTimeout(function () {
          countdownEl.style.display = "none";
          startGame();
        }, 250);
        return;
      }

      ratio = remaining / duration;

      if (ratio > .66) {
        countdownNumberEl.innerHTML = "3";
      } else if (ratio > .33) {
        countdownNumberEl.innerHTML = "2";
      } else {
        countdownNumberEl.innerHTML = "1";
      }

      setTimeout(tick, 60);
    }

    tick();
  }

  function startGame() {
    var i;
    var spawn;
    var angle;
    var worm;

    if (!ctx) {
      setStatus("Canvas not supported");
      return;
    }

    resizeCanvas();

    worms = {};
    wormOrder = [];

    for (i = 0; i < gamePlayers.length; i++) {
      spawn = getSpawnPosition(i, gamePlayers.length);

      angle = Math.atan2(
        getGameHeight() / 2 - spawn.y,
        getGameWidth() / 2 - spawn.x
      );

      worm = createWorm(
        gamePlayers[i],
        spawn.x,
        spawn.y,
        angle
      );

      worms[String(gamePlayers[i].id)] = worm;
      wormOrder.push(String(gamePlayers[i].id));
    }

    apples = [];
    spawnApplesToMax();
    powerUp = null;
    wallsVisibleUntil = 0;
    nextPowerUpAt = new Date().getTime() + randomBetween(7000, 12000);

    gameRunning = true;
    gameEl.style.display = "block";
    lobbyEl.style.display = "none";
    countdownEl.style.display = "none";
    gameOverEl.style.display = "none";

    renderScoreboard();
    sendSocket({ type: "game_running" });

    lastFrame = new Date().getTime();

    if (gameLoopTimer) {
      clearTimeout(gameLoopTimer);
    }

    gameLoop();
  }

  function createWorm(player, x, y, angle) {
    var body = [];
    var i;
    var startLength = 16;

    for (i = 0; i < startLength; i++) {
      body.push({
        x: x - Math.cos(angle) * i * 7,
        y: y - Math.sin(angle) * i * 7
      });
    }

    return {
      id: Number(player.id),
      name: player.name,
      color: player.color,
      alive: true,
      score: 0,
      x: x,
      y: y,
      angle: angle,
      inputX: Math.cos(angle),
      inputY: Math.sin(angle),
      speed: 185,
      body: body,
      targetLength: startLength,
      mouthUntil: 0,
      giantUntil: 0,
      speedUntil: 0,
      hasKnife: false,
      knifeUntil: 0,
      knifeLastCutAt: 0
    };
  }

  function getSpawnPosition(index, count) {
    var w = getGameWidth();
    var h = getGameHeight();
    var cx = w / 2;
    var cy = h / 2;
    var radius = Math.min(w, h) * .27;
    var angle = (Math.PI * 2 * index / Math.max(count, 1)) - Math.PI / 2;

    return {
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius
    };
  }

  function handleSteer(msg) {
    var worm;
    var x;
    var y;
    var mag;

    if (!gameRunning) {
      return;
    }

    worm = worms[String(Number(msg.playerId))];

    if (!worm || !worm.alive) {
      return;
    }

    x = Number(msg.x);
    y = Number(msg.y);

    if (!isFinite(x) || !isFinite(y)) {
      return;
    }

    mag = Math.sqrt(x * x + y * y);

    if (mag < .08) {
      return;
    }

    worm.inputX = x / mag;
    worm.inputY = y / mag;
  }

  function gameLoop() {
    var now;
    var dt;

    if (!gameRunning) {
      return;
    }

    now = new Date().getTime();
    dt = Math.min((now - lastFrame) / 1000, .04);
    lastFrame = now;

    updateGame(dt, now);
    drawGame(now);

    if (now - lastStateBroadcast > 220) {
      lastStateBroadcast = now;
      broadcastTVState();
    }

    gameLoopTimer = setTimeout(gameLoop, 16);
  }

  function updateGame(dt, now) {
    var i;
    var worm;
    var targetAngle;
    var diff;
    var maxTurn;
    var appleDistance;
    var powerDistance;
    var aliveCount = 0;
    var lastAlive = null;
    var w = getGameWidth();
    var h = getGameHeight();

    if (!powerUp && now >= nextPowerUpAt) {
      spawnPowerUp();
    }

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];

      if (!worm || !worm.alive) {
        continue;
      }

      targetAngle = Math.atan2(worm.inputY, worm.inputX);
      diff = normalizeAngle(targetAngle - worm.angle);
      maxTurn = 5.5 * dt;
      diff = clamp(diff, -maxTurn, maxTurn);
      worm.angle += diff;

      var currentSpeed =
        now < worm.speedUntil
          ? worm.speed * 1.75
          : worm.speed;

      worm.x += Math.cos(worm.angle) * currentSpeed * dt;
      worm.y += Math.sin(worm.angle) * currentSpeed * dt;

      /*
        Normally screen edges are portals.
        While the WALLS power-up is active, the visible walls become lethal.
      */
      if (now < wallsVisibleUntil) {
        if (
          worm.x < 10 ||
          worm.x > w - 10 ||
          worm.y < 10 ||
          worm.y > h - 10
        ) {
          killWorm(worm);
          continue;
        }
      } else {
        if (worm.x < 0) worm.x += w;
        if (worm.x >= w) worm.x -= w;
        if (worm.y < 0) worm.y += h;
        if (worm.y >= h) worm.y -= h;
      }

      worm.body.unshift({ x: worm.x, y: worm.y });

      while (worm.body.length > worm.targetLength) {
        worm.body.pop();
      }

      var appleIndex;

      for (appleIndex = apples.length - 1; appleIndex >= 0; appleIndex--) {
        appleDistance = wrappedDistance(
          worm.x, worm.y,
          apples[appleIndex].x, apples[appleIndex].y,
          w, h
        );

        if (appleDistance < getWormRadius(worm, now) + 15) {
          /*
            Apples only grow the worm.
            Up to two apples are present at the same time.
          */
          worm.score += 1;
          worm.targetLength += 5;
          worm.mouthUntil = now + 320;
          apples.splice(appleIndex, 1);
          spawnApplesToMax();
          renderScoreboard();
          break;
        }
      }

      if (powerUp) {
        powerDistance = wrappedDistance(
          worm.x, worm.y,
          powerUp.x, powerUp.y,
          w, h
        );

        if (powerDistance < getWormRadius(worm, now) + 18) {
          if (powerUp.type === "walls") {
            wallsVisibleUntil = now + WALL_REVEAL_MS;
          }

          if (powerUp.type === "giant") {
            worm.giantUntil = now + GIANT_MS;
          }

          if (powerUp.type === "speed") {
            worm.speedUntil = now + SPEED_MS;
          }

          if (powerUp.type === "knife") {
            /*
              The knife is stored until the player chooses to use it
              from the phone controller.
            */
            if (worm.hasKnife) {
              continue;
            }

            worm.hasKnife = true;

            sendSocket({
              type: "knife_collected",
              playerId: worm.id
            });
          }

          powerUp = null;
          nextPowerUpAt = now + randomBetween(9000, 15000);
        }
      }
    }

    checkKnifeCuts(now);
    checkWormCollisions(now);

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];

      if (worm && worm.alive) {
        aliveCount++;
        lastAlive = worm;
      }
    }

    /*
      MULTIPLAYER:
      the last surviving worm wins immediately.
      Score / apple count has no effect on the winner.
    */
    if (gamePlayers.length > 1 && aliveCount === 1) {
      finishGame(lastAlive);
      return;
    }

    if (aliveCount === 0) {
      finishGame(null);
    }
  }

  function activateKnife(msg) {
    var worm = worms[String(Number(msg.playerId))];

    if (!gameRunning || !worm || !worm.alive || !worm.hasKnife) {
      return;
    }

    worm.hasKnife = false;
    worm.knifeUntil = new Date().getTime() + KNIFE_MS;
    worm.knifeLastCutAt = 0;
  }

  function checkKnifeCuts(now) {
    var a, b, i;
    var attacker, victim, point;
    var w = getGameWidth();
    var h = getGameHeight();
    var forward;
    var side;
    var knifeX;
    var knifeY;
    var cutIndex;
    var minLength = 8;

    for (a = 0; a < wormOrder.length; a++) {
      attacker = worms[wormOrder[a]];

      if (
        !attacker ||
        !attacker.alive ||
        now >= attacker.knifeUntil ||
        now - attacker.knifeLastCutAt < 260
      ) {
        continue;
      }

      forward = now < attacker.giantUntil ? 72 : 48;
      side = now < attacker.giantUntil ? 31 : 20;

      knifeX =
        attacker.x +
        Math.cos(attacker.angle) * forward -
        Math.sin(attacker.angle) * side;

      knifeY =
        attacker.y +
        Math.sin(attacker.angle) * forward +
        Math.cos(attacker.angle) * side;

      if (knifeX < 0) knifeX += w;
      if (knifeX >= w) knifeX -= w;
      if (knifeY < 0) knifeY += h;
      if (knifeY >= h) knifeY -= h;

      for (b = 0; b < wormOrder.length; b++) {
        victim = worms[wormOrder[b]];

        if (
          !victim ||
          !victim.alive ||
          victim.id === attacker.id
        ) {
          continue;
        }

        cutIndex = -1;

        for (i = 4; i < victim.body.length; i++) {
          point = victim.body[i];

          if (
            wrappedDistance(
              knifeX, knifeY,
              point.x, point.y,
              w, h
            ) < getBodyRadius(victim, now) + 13
          ) {
            cutIndex = i;
            break;
          }
        }

        if (cutIndex >= 0) {
          /*
            Cut off the tail from the hit point.
            The victim survives, but loses worm size.
          */
          victim.targetLength = Math.max(minLength, cutIndex);
          victim.body = victim.body.slice(0, victim.targetLength);

          victim.score = Math.max(
            0,
            Math.floor(
              (victim.targetLength - 16) / 5
            )
          );

          attacker.knifeLastCutAt = now;
          renderScoreboard();
          break;
        }
      }
    }
  }

  function checkWormCollisions(now) {
    var a;
    var b;
    var i;
    var worm;
    var other;
    var point;
    var hitDistance;
    var w = getGameWidth();
    var h = getGameHeight();

    for (a = 0; a < wormOrder.length; a++) {
      worm = worms[wormOrder[a]];

      if (!worm || !worm.alive) {
        continue;
      }

      for (b = 0; b < wormOrder.length; b++) {
        other = worms[wormOrder[b]];

        if (!other || !other.alive) {
          continue;
        }

        /*
          A worm can never die by touching its own body.
          While its knife is active it can slash through enemy bodies.
        */
        if (worm.id === other.id || now < worm.knifeUntil) {
          continue;
        }

        hitDistance =
          getWormRadius(worm, now) +
          getBodyRadius(other, now) -
          4;

        for (i = 3; i < other.body.length; i += 2) {
          point = other.body[i];

          if (
            wrappedDistance(
              worm.x, worm.y,
              point.x, point.y,
              w, h
            ) < hitDistance
          ) {
            killWorm(worm);
            break;
          }
        }

        if (!worm.alive) {
          break;
        }
      }
    }
  }

  function killWorm(worm) {
    if (!worm.alive) {
      return;
    }

    worm.alive = false;
    worm.body = [];
    renderScoreboard();
  }

  function spawnApple() {
    var padding = 80;
    var w = getGameWidth();
    var h = getGameHeight();

    apples.push({
      x: randomBetween(padding, Math.max(padding + 1, w - padding)),
      y: randomBetween(padding, Math.max(padding + 1, h - padding))
    });
  }

  function spawnApplesToMax() {
    while (apples.length < 2) {
      spawnApple();
    }
  }


  function spawnPowerUp() {
    var padding = 90;
    var w = getGameWidth();
    var h = getGameHeight();

    var roll = Math.random();
    var type = "walls";

    if (roll < .25) {
      type = "walls";
    } else if (roll < .50) {
      type = "giant";
    } else if (roll < .75) {
      type = "speed";
    } else {
      type = "knife";
    }

    powerUp = {
      type: type,
      x: randomBetween(padding, Math.max(padding + 1, w - padding)),
      y: randomBetween(padding, Math.max(padding + 1, h - padding))
    };
  }

  function getWormRadius(worm, now) {
    return now < worm.giantUntil ? 38 : 20;
  }

  function getBodyRadius(worm, now) {
    return now < worm.giantUntil ? 27 : 12;
  }

  function wrappedDistance(x1, y1, x2, y2, w, h) {
    var dx = Math.abs(x1 - x2);
    var dy = Math.abs(y1 - y2);

    if (dx > w / 2) dx = w - dx;
    if (dy > h / 2) dy = h - dy;

    return Math.sqrt(dx * dx + dy * dy);
  }

  function drawPowerUp(item, now) {
    var pulse;

    if (!item) {
      return;
    }

    pulse = 1 + Math.sin(now / 160) * .12;

    ctx.save();
    ctx.translate(item.x, item.y);
    ctx.scale(pulse, pulse);

    if (item.type === "walls") {
      ctx.strokeStyle = "#b97cff";
      ctx.fillStyle = "rgba(185,124,255,.18)";
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2, false);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#d9b8ff";
      ctx.fillRect(-11, -12, 7, 24);
      ctx.fillRect(4, -12, 7, 24);
      ctx.fillRect(-11, -4, 22, 8);

    } else if (item.type === "giant") {
      ctx.strokeStyle = "#ffb347";
      ctx.fillStyle = "rgba(255,179,71,.18)";
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2, false);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#ffd08a";
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI * 2, false);
      ctx.fill();

      ctx.strokeStyle = "#ffd08a";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-17, 0);
      ctx.lineTo(17, 0);
      ctx.moveTo(0, -17);
      ctx.lineTo(0, 17);
      ctx.stroke();

    } else if (item.type === "speed") {
      /* SPEED power-up: cyan lightning bolt */
      ctx.strokeStyle = "#42e8ff";
      ctx.fillStyle = "rgba(66,232,255,.18)";
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2, false);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#8ff5ff";
      ctx.beginPath();
      ctx.moveTo(4, -17);
      ctx.lineTo(-9, 2);
      ctx.lineTo(-1, 2);
      ctx.lineTo(-6, 17);
      ctx.lineTo(12, -5);
      ctx.lineTo(3, -5);
      ctx.closePath();
      ctx.fill();

    } else {
      /* KNIFE power-up */
      ctx.strokeStyle = "#ff596e";
      ctx.fillStyle = "rgba(255,89,110,.18)";
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2, false);
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.rotate(-.55);

      ctx.fillStyle = "#e8edf5";
      ctx.beginPath();
      ctx.moveTo(-2, -17);
      ctx.lineTo(7, 7);
      ctx.lineTo(0, 13);
      ctx.lineTo(-7, 7);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#6f3d2f";
      ctx.fillRect(-4, 9, 8, 12);

      ctx.restore();
    }

    ctx.restore();
  }

  function drawRevealedWalls(now, w, h) {
    var alpha;

    if (now >= wallsVisibleUntil) {
      return;
    }

    alpha = Math.min(1, (wallsVisibleUntil - now) / 700);

    ctx.save();
    ctx.strokeStyle = "rgba(185,124,255," + (0.35 + alpha * 0.45) + ")";
    ctx.lineWidth = 10;
    ctx.shadowBlur = 22;
    ctx.shadowColor = "#b97cff";
    ctx.strokeRect(5, 5, w - 10, h - 10);
    ctx.restore();
  }

  function drawGame(now) {
    var i;
    var worm;
    var w = getGameWidth();
    var h = getGameHeight();

    ctx.clearRect(0, 0, w, h);
    drawBackground(w, h);
    drawRevealedWalls(now, w, h);

    for (i = 0; i < apples.length; i++) {
      drawApple(apples[i].x, apples[i].y);
    }

    if (powerUp) {
      drawPowerUp(powerUp, now);
    }

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];
      if (worm && worm.alive) {
        drawWorm(worm, now);
      }
    }
  }

  function drawBackground(w, h) {
    var grad;
    var x;
    var y;
    var grid = 50;

    grad = ctx.createRadialGradient(
      w / 2, h / 2, 0,
      w / 2, h / 2, Math.max(w, h)
    );

    grad.addColorStop(0, "#101827");
    grad.addColorStop(1, "#030507");

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = "rgba(255,255,255,.035)";
    ctx.lineWidth = 1;

    for (x = 0; x < w; x += grid) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }

    for (y = 0; y < h; y += grid) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
  }

  function drawApple(x, y) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = "#ff354f";
    ctx.beginPath();
    ctx.arc(-7, 2, 14, 0, Math.PI * 2, false);
    ctx.arc(7, 2, 14, 0, Math.PI * 2, false);
    ctx.fill();

    ctx.strokeStyle = "#6b451e";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(3, -24);
    ctx.stroke();

    ctx.fillStyle = "#43d66f";
    ctx.beginPath();
    ctx.arc(10, -19, 6, 0, Math.PI * 2, false);
    ctx.fill();

    ctx.restore();
  }

  function drawWorm(worm, now) {
    var palette = COLORS[worm.color] || COLORS.green;
    var body = worm.body;
    var i;
    var giant = now < worm.giantUntil;
    var bodyRadius = giant ? 27 : 12;
    var headRadius = giant ? 38 : 20;
    var eyeX = giant ? 14 : 7;
    var eyeY = giant ? 15 : 8;
    var eyeScale = giant ? 1.65 : 1;

    if (!body || body.length < 2) {
      return;
    }

    /*
      Draw body as separate circles. This prevents an ugly line from
      being drawn across the whole TV when the worm wraps at an edge.
    */
    ctx.save();
    ctx.fillStyle = palette.body;

    for (i = body.length - 1; i >= 1; i--) {
      ctx.beginPath();
      ctx.arc(
        body[i].x,
        body[i].y,
        bodyRadius,
        0,
        Math.PI * 2,
        false
      );
      ctx.fill();
    }

    ctx.restore();

    ctx.save();
    ctx.translate(worm.x, worm.y);
    ctx.rotate(worm.angle);

    if (now < worm.speedUntil) {
      ctx.save();
      ctx.strokeStyle = "rgba(66,232,255,.75)";
      ctx.lineWidth = giant ? 8 : 5;
      ctx.shadowBlur = 18;
      ctx.shadowColor = "#42e8ff";
      ctx.beginPath();
      ctx.arc(0, 0, headRadius + (giant ? 9 : 6), 0, Math.PI * 2, false);
      ctx.stroke();
      ctx.restore();
    }

    ctx.fillStyle = palette.body;
    ctx.beginPath();
    ctx.arc(0, 0, headRadius, 0, Math.PI * 2, false);
    ctx.fill();

    ctx.save();
    ctx.scale(eyeScale, eyeScale);
    drawEye(eyeX / eyeScale, -eyeY / eyeScale);
    drawEye(eyeX / eyeScale, eyeY / eyeScale);
    ctx.restore();

    if (now < worm.mouthUntil) {
      ctx.fillStyle = "#25040a";
      ctx.beginPath();
      ctx.arc(
        giant ? 27 : 15,
        0,
        giant ? 12 : 7,
        0,
        Math.PI * 2,
        false
      );
      ctx.fill();
    } else {
      ctx.strokeStyle = "#4a1018";
      ctx.lineWidth = giant ? 4 : 2;
      ctx.beginPath();
      ctx.arc(
        giant ? 23 : 11,
        0,
        giant ? 12 : 7,
        -.7,
        .7,
        false
      );
      ctx.stroke();
    }

    if (now < worm.knifeUntil) {
      /*
        Small arm + knife on the right side of the worm's head.
        It rotates with the head because we are already in head space.
      */
      ctx.save();
      ctx.rotate(.55);

      ctx.strokeStyle = palette.dark;
      ctx.lineWidth = giant ? 9 : 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(5, giant ? 25 : 14);
      ctx.lineTo(18, giant ? 34 : 22);
      ctx.stroke();

      ctx.translate(20, giant ? 35 : 23);
      ctx.rotate(-.85);

      ctx.fillStyle = "#8a4b36";
      ctx.fillRect(-4, -2, 8, giant ? 17 : 12);

      ctx.fillStyle = "#eef3fa";
      ctx.beginPath();
      ctx.moveTo(-5, 0);
      ctx.lineTo(0, giant ? -31 : -23);
      ctx.lineTo(7, -3);
      ctx.lineTo(0, 4);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    ctx.restore();
  }

  function drawEye(x, y) {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2, false);
    ctx.fill();

    ctx.fillStyle = "#080b10";
    ctx.beginPath();
    ctx.arc(x + 2, y, 2.4, 0, Math.PI * 2, false);
    ctx.fill();
  }

  function renderScoreboard() {
    var list = [];
    var i;
    var worm;
    var row;
    var dot;
    var value;

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];
      if (worm) {
        list.push(worm);
      }
    }

    list.sort(function (a, b) {
      return b.score - a.score;
    });

    scoreboardEl.innerHTML = "";

    for (i = 0; i < list.length; i++) {
      worm = list[i];

      row = document.createElement("div");
      row.className = "scoreRow" + (worm.alive ? "" : " dead");

      dot = document.createElement("span");
      dot.className = "scoreDot";
      dot.style.backgroundColor =
        COLORS[worm.color] ? COLORS[worm.color].body : "#fff";

      value = document.createElement("span");
      value.className = "scoreValue";
      value.innerHTML = String(worm.score) + " FOOD";

      row.appendChild(dot);
      row.appendChild(document.createTextNode(worm.name));
      row.appendChild(value);

      scoreboardEl.appendChild(row);
    }
  }

  function broadcastTVState() {
    var list = [];
    var i;
    var worm;

    if (!gameRunning) {
      return;
    }

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];
      if (worm) {
        list.push({
          id: worm.id,
          score: worm.score,
          alive: worm.alive
        });
      }
    }

    sendSocket({
      type: "tv_state",
      state: { players: list }
    });
  }

  function finishGame(survivor) {
    var results = [];
    var i;
    var worm;
    var winner = survivor || null;

    if (!gameRunning) {
      return;
    }

    gameRunning = false;

    if (gameLoopTimer) {
      clearTimeout(gameLoopTimer);
      gameLoopTimer = null;
    }

    for (i = 0; i < wormOrder.length; i++) {
      worm = worms[wormOrder[i]];

      if (worm) {
        results.push({
          id: worm.id,
          name: worm.name,
          color: worm.color,
          score: worm.score,
          alive: worm.alive
        });
      }
    }

    /*
      Winner is determined ONLY by survival.
      Food count is shown as worm growth information.
    */
    results.sort(function (a, b) {
      if (winner) {
        if (a.id === winner.id) return -1;
        if (b.id === winner.id) return 1;
      }

      if (a.alive !== b.alive) {
        return a.alive ? -1 : 1;
      }

      return b.score - a.score;
    });

    sendSocket({
      type: "game_over",
      results: results,
      winner: winner ? {
        id: winner.id,
        name: winner.name,
        color: winner.color,
        score: winner.score
      } : null
    });

    showGameOver(results, winner);
  }

  function showGameOver(results, winner) {
    var i;
    var row;

    gameEl.style.display = "none";
    countdownEl.style.display = "none";
    lobbyEl.style.display = "none";
    gameOverEl.style.display = "block";

    winnerNameEl.innerHTML = winner ? escapeHtml(winner.name) : "NO WINNER";

    if (winner && COLORS[winner.color]) {
      winnerNameEl.style.color = COLORS[winner.color].body;
    } else {
      winnerNameEl.style.color = "#fff";
    }

    finalScoresEl.innerHTML = "";

    for (i = 0; i < results.length; i++) {
      row = document.createElement("div");
      row.className = "finalRow";

      row.innerHTML =
        '<span class="finalPos">#' + (i + 1) + '</span>' +
        escapeHtml(results[i].name) +
        '<span class="finalPoints">' +
        results[i].score +
        (results[i].score === 1 ? " FOOD" : " FOOD") +
        "</span>";

      finalScoresEl.appendChild(row);
    }
  }

  function resetGame() {
    gameRunning = false;

    if (gameLoopTimer) {
      clearTimeout(gameLoopTimer);
      gameLoopTimer = null;
    }

    worms = {};
    wormOrder = [];
    gamePlayers = [];
    apples = [];
    powerUp = null;
    nextPowerUpAt = 0;
    wallsVisibleUntil = 0;
    scoreboardEl.innerHTML = "";
    finalScoresEl.innerHTML = "";
  }

  function showLobby() {
    lobbyEl.style.display = "block";
    countdownEl.style.display = "none";
    gameEl.style.display = "none";
    gameOverEl.style.display = "none";
    renderLobby();
  }

  function sendSocket(msg) {
    try {
      if (socket && socket.readyState === 1) {
        socket.send(JSON.stringify(msg));
      }
    } catch (e) {}
  }

  function resizeCanvas() {
    canvas.width = getGameWidth();
    canvas.height = getGameHeight();
  }

  function getGameWidth() {
    return window.innerWidth || document.documentElement.clientWidth || 1280;
  }

  function getGameHeight() {
    return window.innerHeight || document.documentElement.clientHeight || 720;
  }

  function normalizeAngle(a) {
    while (a > Math.PI) {
      a -= Math.PI * 2;
    }
    while (a < -Math.PI) {
      a += Math.PI * 2;
    }
    return a;
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function randomBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function distance(x1, y1, x2, y2) {
    var dx = x1 - x2;
    var dy = y1 - y2;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  if (window.attachEvent) {
    window.attachEvent("onresize", function () {
      if (gameRunning) {
        resizeCanvas();
      }
    });
  } else if (window.addEventListener) {
    window.addEventListener("resize", function () {
      if (gameRunning) {
        resizeCanvas();
      }
    }, false);
  }

  startTV();

})();
</script>

</body>
</html>
